<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For Ray's 24th Birthday</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at top, #252525 0%, #111 45%, #050505 100%);

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }


        /* =========================
           第一幕：Security Check
        ========================== */

        #loginPage {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        .security-card {
            width: 100%;
            max-width: 420px;

            padding: 45px 35px;

            border: 1px solid rgba(212, 175, 55, 0.45);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35,35,35,0.95),
                    rgba(8,8,8,0.98)
                );

            box-shadow:
                0 25px 60px rgba(0,0,0,0.6);

            text-align: center;
        }


        .small-label {
            color: #999;
            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 8px;
        }


        .title {
            margin: 0;

            font-size: 28px;

            letter-spacing: 3px;

            color: #d4af37;
        }


        .private-text {
            margin-top: 10px;
            margin-bottom: 45px;

            color: #777;

            font-size: 11px;

            letter-spacing: 4px;
        }


        .cardholder-name {
            font-size: 21px;

            letter-spacing: 3px;

            margin-bottom: 35px;
        }


        .security-label {
            color: #888;

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 12px;
        }


        #password {
            width: 100%;

            border: none;
            border-bottom: 1px solid #777;

            background: transparent;

            color: white;

            font-size: 27px;

            letter-spacing: 10px;

            text-align: center;

            padding: 12px;

            outline: none;

            transition: 0.3s;
        }


        #password:focus {
            border-bottom:
                1px solid #d4af37;
        }


        #password::placeholder {
            color: #555;
        }


        .unlock-button {
            margin-top: 35px;

            width: 100%;

            padding: 15px;

            border: 1px solid #d4af37;

            background: transparent;

            color: #d4af37;

            font-size: 12px;

            letter-spacing: 3px;

            cursor: pointer;

            transition: 0.3s;

            border-radius: 4px;
        }


        .unlock-button:hover {
            background: #d4af37;
            color: #111;
        }


        #error {
            height: 20px;

            margin-top: 18px;

            color: #c46b6b;

            font-size: 11px;

            letter-spacing: 2px;
        }





        #verificationPage {
            position: fixed;

            inset: 0;

            background: #080808;

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 100;

            opacity: 0;

            transition: opacity 0.5s ease;
        }


        .verification-box {
            width: 80%;
            max-width: 430px;

            text-align: center;
        }


        #verifyText {
            color: #aaa;

            font-size: 12px;

            letter-spacing: 4px;

            margin-bottom: 30px;
        }


        .progress-container {
            width: 100%;
            height: 3px;

            background: #252525;

            overflow: hidden;

            margin-bottom: 15px;
        }


        #progressBar {
            height: 100%;

            width: 0%;

            background: #d4af37;

            transition: width 0.08s linear;
        }


        #progressNumber {
            color: #777;

            font-size: 12px;

            letter-spacing: 2px;
        }


        #accessGranted {
            display: none;

            color: #d4af37;

            font-size: 22px;

            letter-spacing: 4px;

            margin-top: 35px;

            animation: granted 0.7s ease forwards;
        }


        @keyframes granted {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }



        /* =========================
           第三幕：生日內容
        ========================== */

        #birthdayPage {

            display: none;

            min-height: 100vh;

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;

            text-align: center;

            padding: 100px 25px;
        }


        .birthday-content {

            max-width: 700px;

            margin: auto;
        }


        .access-label {

            color: #d4af37;

            font-size: 11px;

            letter-spacing: 4px;

            margin-bottom: 15px;
        }


        .welcome-title {

            font-size: 38px;

            margin-bottom: 10px;

            font-weight: 400;
        }


        .birthday-subtitle {

            color: #aaa;

            font-size: 17px;

            margin-bottom: 50px;
        }


        .divider {

            width: 50px;
            height: 1px;

            margin: 35px auto;

            background: #d4af37;
        }


        .message {

            line-height: 2;

            color: #ccc;

            font-size: 16px;
        }



        /* 手機 */

        @media (max-width: 600px) {

            .security-card {
                padding: 40px 25px;
            }

            .title {
                font-size: 23px;
            }

            .welcome-title {
                font-size: 30px;
            }

        }

    </style>
</head>


<body>



<!-- ========================================
     第一幕：Security Check
========================================= -->

<section id="loginPage">

    <div class="security-card">

        <div class="small-label">
            OFFICIAL BIRTHDAY ACCESS
        </div>

        <h1 class="title">
            For Ray's 24th Birthday
        </h1>

        <div class="private-text">
            PRIVATE ACCESS ONLY
        </div>



        <div class="small-label">
            CARDHOLDER
        </div>



        <div class="cardholder-name">
            Ray Chen
        </div>



        <div class="security-label">
            ENTER SECURITY CODE
        </div>

        <input
            type="password"
            id="password"
            maxlength="6"
            inputmode="numeric"
            placeholder="••••••"
        >


        <button
            class="unlock-button"
            onclick="unlockCard()">

            UNLOCK CARD

        </button>


        <div id="error"></div>

    </div>

</section>




<section id="verificationPage">

    <div class="verification-box">

        <div id="verifyText">
            VERIFYING CARDHOLDER...
        </div>


        <div class="progress-container">

            <div id="progressBar"></div>

        </div>


        <div id="progressNumber">
            0%
        </div>


        <div id="accessGranted">

            ACCESS GRANTED ✓

        </div>

    </div>

</section>



<!-- ========================================
     第三幕：Birthday Page
========================================= -->

<section id="birthdayPage">

    <div class="birthday-content">

        <div class="access-label">
            CARD ACTIVATED
        </div>


        <h1 class="welcome-title">
            HAPPY BIRTHDAY ♡
        </h1>


        <div class="birthday-subtitle">

            Welcome to your Birthday Black Card.

        </div>


        <div class="divider"></div>


        <div class="message">

            恭喜你成功解鎖這張卡片。

            <br><br>

            這裡之後就可以開始放
            我們的照片、回憶、影片，
            還有一些你現在還不知道的東西。

        </div>

    </div>

</section>



<script>



const correctPassword = "910821";



/* ========================================
   Unlock
========================================= */

function unlockCard() {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if (password === correctPassword) {

        error.innerText = "";

        startVerification();

    }

    else {

        error.innerText =
            "ACCESS DENIED — INVALID SECURITY CODE";

        document.getElementById("password").value = "";

    }

}



/* ========================================
   驗證動畫
========================================= */

function startVerification() {

    const loginPage =
        document.getElementById("loginPage");

    const verificationPage =
        document.getElementById("verificationPage");


    /* 登入頁淡出 */

    loginPage.style.opacity = "0";

    loginPage.style.transform =
        "scale(0.98)";


    setTimeout(function () {

        loginPage.style.display = "none";

        verificationPage.style.display =
            "flex";


        setTimeout(function () {

            verificationPage.style.opacity =
                "1";

        }, 50);


        runProgress();

    }, 700);

}



/* ========================================
   進度條
========================================= */

function runProgress() {

    let progress = 0;

    const bar =
        document.getElementById("progressBar");

    const number =
        document.getElementById("progressNumber");

    const granted =
        document.getElementById("accessGranted");


    const interval =
        setInterval(function () {


            /* 每次增加一點 */

            progress +=
                Math.floor(Math.random() * 7) + 2;


            if (progress >= 100) {

                progress = 100;

                clearInterval(interval);

            }


            bar.style.width =
                progress + "%";

            number.innerText =
                progress + "%";



            /* 到 100% */

            if (progress === 100) {

                setTimeout(function () {

                    document.getElementById(
                        "verifyText"
                    ).innerText =
                        "CARDHOLDER VERIFIED";


                    granted.style.display =
                        "block";


                    /* 停留一下 */

                    setTimeout(function () {

                        openBirthdayPage();

                    }, 1400);


                }, 400);

            }


        }, 90);

}



/* ========================================
   開啟生日頁
========================================= */

function openBirthdayPage() {

    const verificationPage =
        document.getElementById(
            "verificationPage"
        );

    const birthdayPage =
        document.getElementById(
            "birthdayPage"
        );


    verificationPage.style.opacity =
        "0";


    setTimeout(function () {

        verificationPage.style.display =
            "none";


        birthdayPage.style.display =
            "block";


        setTimeout(function () {

            birthdayPage.style.opacity =
                "1";

            birthdayPage.style.transform =
                "translateY(0)";

        }, 50);


    }, 700);

}





document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                unlockCard();

            }

        }
    );


</script>


</body>

</html>
